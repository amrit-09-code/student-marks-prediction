<style>
body { font-family: Arial; background: #f0f2f5; display: flex; justify-content: center; padding-top: 30px; }
.card { background: white; padding: 30px; border-radius: 15px; width: 420px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
h1 { color: #1a73e8; text-align: center; }
label { font-weight: bold; font-size: 14px; }
input { width: 100%; padding: 10px; margin: 6px 0 15px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
button { width: 100%; background: #1a73e8; color: white; padding: 12px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
button:hover { background: #1557b0; }
a { display: block; text-align: center; margin-top: 15px; color: #1a73e8; }
</style>

<div class="card">
<h1>Enter Student Details</h1>
<form method="POST">
{% csrf_token %}
<label>Name</label>
<input type="text" name="name" placeholder="e.g. Rahul Sharma" required>

<label>Study Hours (per day)</label>
<input type="number" step="0.1" name="study_hours" placeholder="e.g. 5" required>

<label>Attendance %</label>
<input type="number" name="attendance" placeholder="e.g. 85" required>

<label>Previous Marks (out of 100)</label>
<input type="number" name="previous_marks" placeholder="e.g. 70" required>

<label>Sleep Hours</label>
<input type="number" step="0.1" name="sleep_hours" placeholder="e.g. 7" required>

<button type="submit">Predict Performance</button>
</form>
<a href="/">Back to Home</a>
</div>
